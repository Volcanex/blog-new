        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
        }

        .top-nav {
            background: #1a1a1a;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            position: sticky;
            top: 0;
            z-index: 10000;
        }

        .top-nav h1 {
            font-size: 16px;
            color: #fff;
        }

        .top-nav a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            margin-left: 20px;
        }

        .presets {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .presets label {
            color: #888;
            font-size: 12px;
        }

        .presets select {
            background: #272822;
            color: #fff;
            border: 1px solid #444;
            padding: 5px 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            cursor: pointer;
        }

        .presets button {
            background: #ff00ff;
            color: #000;
            border: none;
            padding: 5px 15px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: bold;
        }

        .presets button:hover {
            background: #ff33ff;
        }

        .presets button.save-btn {
            background: #00ff00;
        }

        .presets button.save-btn:hover {
            background: #33ff33;
        }

        .container {
            display: flex;
            height: calc(100vh - 50px);
        }

        .editor-panel {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #333;
            background: #272822;
        }

        .preview-panel {
            width: 50%;
            background: #fff;
        }

        .tabs {
            display: flex;
            background: #1e1e1e;
            border-bottom: 1px solid #333;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            color: #888;
            border: none;
            background: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .tab.active {
            color: #fff;
            background: #272822;
        }

        .editor-container {
            flex: 1;
            position: relative;
        }

        .editor {
            display: none;
            height: 100%;
        }

        .editor.active {
            display: block;
        }

        .CodeMirror {
            height: 100% !important;
            font-size: 14px;
        }

        #preview {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .preview-header {
            background: #f0f0f0;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-header h2 {
            font-size: 14px;
            color: #333;
        }

        .refresh-btn {
            padding: 5px 15px;
            background: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        .refresh-btn:hover {
            background: #333;
        }
    </style>
</head>

.header {

@keyframes glow {

h1 {

.glitch {

    text-shadow: 0 0 10px #00ffff;
    position: relative;
    animation: glitch 3s infinite;
}

@keyframes glitch {
    0%, 100% { transform: translate(0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(-2px, -2px); }
    60% { transform: translate(2px, 2px); }
    80% { transform: translate(2px, -2px); }
}

marquee {

.gallery {

.photo-box {

.photo-box:hover {

}

.photo-box img {

.photo-box p {

.blink {

}

@keyframes blink {

    if (glitch) {
        setInterval(() => {

            const glitched = text.split('').map(char =>

            setTimeout(() => glitch.textContent = text, 50);
        }, 3000);
    }
