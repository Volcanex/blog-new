<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://baselinelabs.ai/js/tracker.js" data-site="09f6d274c6a90724de51d9a3"></script>
    <title>Red Flag Dating Game</title>
    <link rel="icon" href="../favicon.svg">
    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap');

:root {
    --primary: #2a2a28;
    --accent: #7a8a6e;
    --accent-hover: #5d7050;
    --bg: #f5f2ed;
    --border: #e5e0d8;
    --text-muted: #6b6860;
    --text-light: #9a958c;
    --red: #c44;
    --red-bg: rgba(204,68,68,0.08);
    --red-border: rgba(204,68,68,0.2);
    --green: #5a8a5a;
    --green-bg: rgba(90,138,90,0.08);
    --green-border: rgba(90,138,90,0.2);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--primary);
    margin: 0; padding: 0;
    min-height: 100vh;
    line-height: 1.6;
    font-size: 0.95rem;
}

/* Subtle grain overlay */
body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
}

.app { max-width: 640px; margin: 0 auto; padding: 20px 16px; min-height: 100vh; }

/* Header */
.header { text-align: center; padding: 28px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.header h1 {
    font-family: 'Cardo', serif; font-size: 2rem; font-weight: 700;
    color: var(--primary); letter-spacing: -0.02em;
}
.header .tagline { color: var(--text-light); font-size: 0.85rem; margin-top: 6px; letter-spacing: 0.02em; }

/* Views */
.view { display: none; }
.view.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ── Player Hub ── */
.player-hub { padding: 0; }
.add-player-bar { display: flex; gap: 10px; margin-bottom: 24px; }
.add-player-bar input {
    flex: 1; padding: 12px 16px; border-radius: 8px;
    border: 1px solid var(--border); background: #fff;
    color: var(--primary); font-size: 0.95rem; outline: none;
    font-family: inherit; transition: border-color 0.2s;
}
.add-player-bar input:focus { border-color: var(--accent); }
.add-player-bar input::placeholder { color: var(--text-light); }

.btn {
    padding: 12px 20px; border: none; border-radius: 8px;
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: all 0.2s; white-space: nowrap; font-family: inherit;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--primary); color: var(--bg); }
.btn-primary:hover { background: #3a3a38; }
.btn-green { background: var(--accent); color: #fff; }
.btn-green:hover { background: var(--accent-hover); }
.btn-secondary { background: #fff; color: var(--primary); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--text-light); }
.btn-small { padding: 8px 14px; font-size: 0.8rem; }
.btn-tiny { padding: 5px 12px; font-size: 0.75rem; border-radius: 6px; }
.btn-danger { background: #fff; color: var(--red); border: 1px solid var(--red-border); }
.btn-danger:hover { background: var(--red-bg); }

.player-list { display: flex; flex-direction: column; gap: 8px; }
.player-card {
    background: #fff; border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 18px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer; transition: all 0.2s;
}
.player-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.player-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 700; color: var(--bg); flex-shrink: 0;
}
.player-info { flex: 1; min-width: 0; }
.player-name { font-weight: 600; font-size: 1rem; color: var(--primary); }
.player-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
.player-stage {
    font-size: 0.7rem; font-weight: 600; padding: 4px 10px;
    border-radius: 20px; background: rgba(122,138,110,0.12);
    color: var(--accent-hover); white-space: nowrap; text-transform: uppercase;
    letter-spacing: 0.03em;
}
.player-remove {
    background: none; border: none; color: var(--text-light); font-size: 1.2rem;
    cursor: pointer; padding: 4px 8px; transition: color 0.2s;
}
.player-remove:hover { color: var(--red); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-icon { font-size: 2rem; margin-bottom: 12px; }
.empty-state p { font-size: 0.95rem; }

/* ── Stage View ── */
.stage-header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 0; margin-bottom: 12px;
}
.back-btn {
    background: none; border: none; color: var(--text-muted); font-size: 1.3rem;
    cursor: pointer; padding: 4px; transition: color 0.2s;
}
.back-btn:hover { color: var(--primary); }
.stage-title {
    font-family: 'Cardo', serif; font-size: 1.2rem;
    font-weight: 700; color: var(--primary); flex: 1;
}

/* Stage Progress */
.stage-progress { display: flex; gap: 5px; margin-bottom: 20px; padding: 0 2px; }
.stage-dot {
    flex: 1; height: 4px; border-radius: 2px;
    background: var(--border); cursor: pointer;
    transition: all 0.2s; position: relative;
}
.stage-dot.active { background: var(--primary); }
.stage-dot.completed { background: var(--accent); }
.stage-dot:hover { opacity: 0.7; }
.stage-label {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    font-size: 0.6rem; color: var(--text-muted); white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
}
.stage-dot:hover .stage-label { opacity: 1; }

/* Tabs - single row */
.tab-bar {
    display: flex; gap: 0; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
}
.tab {
    flex: 1; padding: 10px 0; border: none;
    background: transparent; color: var(--text-light); font-size: 0.8rem;
    font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center;
    text-transform: uppercase; letter-spacing: 0.06em;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    font-family: inherit;
}
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab:hover { color: var(--text-muted); }

/* Identity Picker */
.identity-section { margin-bottom: 20px; }
.identity-card {
    background: #fff; border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; text-align: center; margin-bottom: 10px;
}
.identity-label {
    font-size: 0.7rem; color: var(--text-light); text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 8px; font-weight: 600;
}
.identity-value {
    font-family: 'Cardo', serif; font-size: 1.5rem; font-weight: 700;
    color: var(--primary); margin-bottom: 14px;
    min-height: 2em; display: flex; align-items: center; justify-content: center;
}
.identity-nav { display: flex; gap: 8px; justify-content: center; align-items: center; }
.nav-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border); background: #fff;
    color: var(--primary); font-size: 1.1rem; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
}
.nav-btn:hover { background: var(--bg); border-color: var(--text-light); }
.shuffle-btn {
    width: auto; padding: 0 14px; border-radius: 20px;
    font-size: 0.8rem; gap: 4px; font-family: inherit;
}
.lock-btn {
    padding: 8px 20px; border: none; border-radius: 6px;
    font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    font-family: inherit;
}
.lock-btn.unlocked { background: rgba(122,138,110,0.1); color: var(--accent-hover); }
.lock-btn.unlocked:hover { background: rgba(122,138,110,0.18); }
.lock-btn.locked { background: var(--accent); color: #fff; }

/* Flag Swiper */
.flag-swiper { margin-bottom: 20px; }
.swiper-card {
    background: var(--red-bg); border: 1px solid var(--red-border);
    border-radius: 12px; padding: 32px 24px; text-align: center;
    min-height: 180px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; margin-bottom: 14px;
    transition: all 0.3s;
}
.swiper-card.green { background: var(--green-bg); border-color: var(--green-border); }
.swiper-icon { margin-bottom: 14px; }
.swiper-icon svg { width: 36px; height: 36px; }
.swiper-text {
    font-family: 'Cardo', serif; font-size: 1.2rem;
    font-weight: 400; font-style: italic;
    color: var(--primary); line-height: 1.5;
}

.swiper-controls { display: flex; gap: 10px; justify-content: center; align-items: center; }
.swipe-btn {
    padding: 12px 24px; border: none; border-radius: 8px;
    font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    font-family: inherit;
}
.swipe-pass { background: #fff; color: var(--text-muted); border: 1px solid var(--border); }
.swipe-pass:hover { border-color: var(--text-light); color: var(--primary); }
.swipe-save { background: var(--primary); color: var(--bg); }
.swipe-save:hover { background: #3a3a38; }
.swipe-save.green-save { background: var(--accent); color: #fff; }
.swipe-save.green-save:hover { background: var(--accent-hover); }

.flag-mode-toggle { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
.mode-btn {
    padding: 7px 16px; border: 1px solid var(--border); border-radius: 20px;
    background: #fff; color: var(--text-light); font-size: 0.78rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
    text-transform: uppercase; letter-spacing: 0.04em;
}
.mode-btn.active-red { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }
.mode-btn.active-green { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }

/* Saved Flags */
.saved-section { margin-bottom: 20px; }
.saved-stage-group { margin-bottom: 20px; }
.saved-stage-title {
    font-size: 0.72rem; font-weight: 700; color: var(--text-light);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
}
.saved-flag {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; margin-bottom: 4px;
    background: #fff; border-radius: 6px; border: 1px solid var(--border);
    transition: background 0.2s;
}
.saved-flag:hover { background: var(--bg); }
.saved-flag-icon { flex-shrink: 0; }
.saved-flag-icon svg { width: 14px; height: 14px; }
.saved-flag-text { flex: 1; font-size: 0.85rem; color: var(--primary); }
.saved-flag-remove {
    background: none; border: none; color: var(--text-light); font-size: 0.9rem;
    cursor: pointer; padding: 2px 6px; transition: color 0.2s;
}
.saved-flag-remove:hover { color: var(--red); }
.no-flags { text-align: center; padding: 24px; color: var(--text-light); font-size: 0.85rem; }
.locked-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.7rem; font-weight: 600; color: var(--text-light);
    background: var(--border); padding: 2px 8px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.04em;
}

/* Profile Card */
.profile-summary {
    background: #fff; border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 14px;
}
.profile-avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 700; color: var(--bg); flex-shrink: 0;
    font-family: 'Cardo', serif;
}
.profile-details { flex: 1; }
.profile-name { font-family: 'Cardo', serif; font-size: 1.15rem; font-weight: 700; color: var(--primary); }
.profile-occupation { font-size: 0.82rem; color: var(--accent-hover); margin-top: 2px; }
.profile-nationality { font-size: 0.78rem; color: var(--text-muted); margin-top: 1px; }
.profile-player-name { font-size: 0.7rem; color: var(--text-light); margin-top: 3px; font-style: italic; }

/* Stage advance area */
.stage-advance { text-align: center; padding: 16px 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* Discard button */
.discard-section { text-align: center; margin-top: 12px; }

/* Toast notification */
.toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--primary); color: var(--bg); padding: 10px 24px;
    border-radius: 8px; font-size: 0.85rem; font-weight: 500;
    opacity: 0; transition: all 0.3s ease; z-index: 10000;
    pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* Responsive */
@media (max-width: 640px) {
    .header h1 { font-size: 1.6rem; }
    .identity-value { font-size: 1.3rem; }
    .swiper-text { font-size: 1.05rem; }
    .swiper-card { padding: 24px 16px; min-height: 150px; }
    .add-player-bar { flex-direction: column; }
    .add-player-bar .btn { width: 100%; }
    .app { padding: 16px 12px; }
}
</style>
</head>
<body>
    <div class="app">
    <div class="header">
        <h1>Red Flag Dating Game</h1>
        <p class="tagline">Five dates. Infinite red flags. One true love?</p>
    </div>

    <!-- VIEW: Player Hub -->
    <div class="view active" id="viewHub">
        <div class="player-hub">
            <div class="add-player-bar">
                <input type="text" id="playerNameInput" placeholder="Enter a player name..." maxlength="30">
                <button class="btn btn-primary" onclick="addPlayer()">Add</button>
            </div>
            <div class="player-list" id="playerList">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="12" y1="11" x2="12" y2="14"/><line x1="9" y1="18" x2="15" y2="18"/></svg>
                    </div>
                    <p>Add players to begin</p>
                </div>
            </div>
        </div>
    </div>

    <!-- VIEW: Stage / Game -->
    <div class="view" id="viewStage">
        <div class="stage-header">
            <button class="back-btn" onclick="goHome()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <span class="stage-title" id="stageTitle">First Date</span>
        </div>

        <div class="profile-summary" id="profileSummary">
            <div class="profile-avatar" id="profileAvatar">?</div>
            <div class="profile-details">
                <div class="profile-name" id="profileName">Pick a name...</div>
                <div class="profile-occupation" id="profileOccupation"></div>
                <div class="profile-nationality" id="profileNationality"></div>
                <div class="profile-player-name" id="profilePlayerName"></div>
            </div>
        </div>

        <div class="stage-progress" id="stageProgress"></div>

        <div class="tab-bar">
            <button class="tab active" data-tab="identity" onclick="switchTab('identity')">Identity</button>
            <button class="tab" data-tab="flags" onclick="switchTab('flags')">Flags</button>
            <button class="tab" data-tab="saved" onclick="switchTab('saved')">Saved</button>
        </div>

        <!-- Tab: Identity -->
        <div class="tab-content" id="tabIdentity">
            <div class="identity-section">
                <div class="identity-card">
                    <div class="identity-label">Name</div>
                    <div class="identity-value" id="idName">&mdash;</div>
                    <div class="identity-nav">
                        <button class="nav-btn" onclick="prevIdentity('name')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                        </button>
                        <button class="nav-btn shuffle-btn" onclick="shuffleIdentity('name')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                            Shuffle
                        </button>
                        <button class="nav-btn" onclick="nextIdentity('name')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                        </button>
                    </div>
                    <button class="lock-btn unlocked" id="lockName" onclick="toggleLock('name')" style="margin-top:12px">Lock in</button>
                </div>
                <div class="identity-card">
                    <div class="identity-label">Occupation</div>
                    <div class="identity-value" id="idOccupation">&mdash;</div>
                    <div class="identity-nav">
                        <button class="nav-btn" onclick="prevIdentity('occupation')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                        </button>
                        <button class="nav-btn shuffle-btn" onclick="shuffleIdentity('occupation')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                            Shuffle
                        </button>
                        <button class="nav-btn" onclick="nextIdentity('occupation')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                        </button>
                    </div>
                    <button class="lock-btn unlocked" id="lockOccupation" onclick="toggleLock('occupation')" style="margin-top:12px">Lock in</button>
                </div>
                <div class="identity-card">
                    <div class="identity-label">Nationality</div>
                    <div class="identity-value" id="idNationality">&mdash;</div>
                    <div class="identity-nav">
                        <button class="nav-btn" onclick="prevIdentity('nationality')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                        </button>
                        <button class="nav-btn shuffle-btn" onclick="shuffleIdentity('nationality')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                            Shuffle
                        </button>
                        <button class="nav-btn" onclick="nextIdentity('nationality')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                        </button>
                    </div>
                    <button class="lock-btn unlocked" id="lockNationality" onclick="toggleLock('nationality')" style="margin-top:12px">Lock in</button>
                </div>
            </div>
        </div>

        <!-- Tab: Flags -->
        <div class="tab-content" id="tabFlags" style="display:none">
            <div class="flag-mode-toggle">
                <button class="mode-btn active-red" id="modeRed" onclick="setFlagMode('red')">Red Flags</button>
                <button class="mode-btn" id="modeGreen" onclick="setFlagMode('green')">Green Flags</button>
            </div>
            <div class="flag-swiper">
                <div class="swiper-card" id="swiperCard">
                    <div class="swiper-icon" id="swiperIcon">
                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#c44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
                    </div>
                    <div class="swiper-text" id="swiperText">Tap Next to start swiping flags</div>
                </div>
                <div class="swiper-controls">
                    <button class="swipe-btn swipe-pass" onclick="nextFlag()">Next</button>
                    <button class="swipe-btn swipe-save" id="saveBtn" onclick="saveFlag()">Save to Stage</button>
                </div>
            </div>
        </div>

        <!-- Tab: Saved -->
        <div class="tab-content" id="tabSaved" style="display:none">
            <div class="saved-section" id="savedSection">
                <div class="no-flags">No flags saved yet</div>

let players = [];

let flagMode = 'red';
let currentFlagIndex = { red: -1, green: -1 };
let shuffledRed = [];
let shuffledGreen = [];
let identityIndices = { name: 0, occupation: 0, nationality: 0 };

// Shuffle arrays
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function reshuffleFlags() {
    shuffledRed = shuffle(RED_FLAGS);
    shuffledGreen = shuffle(GREEN_FLAGS);
    currentFlagIndex = { red: -1, green: -1 };
}

function buildNameList(nationality) {
    const data = NATIONALITIES_AND_NAMES[nationality];
    if (!data) return shuffle(Object.values(NATIONALITIES_AND_NAMES).flatMap(d => [...d.m, ...d.f]));
    return shuffle([...data.m, ...data.f]);
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
}

// ── PLAYER MANAGEMENT ──

function addPlayer(nameOverride) {
    const input = document.getElementById('playerNameInput');
    const name = nameOverride || input.value.trim();
    if (!name) return;

    const player = {
        id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
        realName: name,
        stageIndex: 0,
        identity: { name: null, occupation: null, nationality: null },
        locked: { name: false, occupation: false, nationality: false },
        flags: {},
        // snapshot of flags at time of "keep seeing them" - locked per stage
        lockedFlags: {}
    };
    STAGES.forEach(s => { player.flags[s.id] = []; player.lockedFlags[s.id] = null; });
    players.push(player);
    input.value = '';
    renderPlayerList();
    showToast(name + ' added');
}

function removePlayer(id, e) {
    e.stopPropagation();
    players = players.filter(p => p.id !== id);
    renderPlayerList();
}

let _emptyStateEl = null;
function renderPlayerList() {
    const list = document.getElementById('playerList');
    if (!_emptyStateEl) _emptyStateEl = document.getElementById('emptyState');

    if (players.length === 0) {
        list.innerHTML = '';
        list.appendChild(_emptyStateEl);
        _emptyStateEl.style.display = 'block';
        return;
    }

    _emptyStateEl.remove();
    list.innerHTML = players.map(p => {
        const stage = STAGES[p.stageIndex];
        const displayName = p.identity.name || p.realName;
        const initial = displayName.charAt(0).toUpperCase();
        const meta = [];
        if (p.identity.occupation) meta.push(p.identity.occupation);
        if (p.identity.nationality) meta.push(p.identity.nationality);
        const totalFlags = Object.values(p.flags).reduce((sum, arr) => sum + arr.length, 0);

        return `<div class="player-card" onclick="openPlayer('${p.id}')">
            <div class="player-avatar">${initial}</div>
            <div class="player-info">
                <div class="player-name">${displayName}</div>
                <div class="player-meta">${meta.length ? meta.join(' &middot; ') : 'Tap to set up'} &middot; ${totalFlags} flags</div>
            </div>
            <span class="player-stage">${stage.name}</span>
            <button class="player-remove" onclick="removePlayer('${p.id}', event)">&times;</button>
        </div>`;
    }).join('');
}

// ── OPEN PLAYER ──

function openPlayer(id) {
    currentPlayerId = id;
    const player = players.find(p => p.id === id);
    if (!player) return;

    reshuffleFlags();

    // Set up identity indices
    const nat = player.identity.nationality || NATIONALITIES[0];
    identityIndices.nationality = NATIONALITIES.indexOf(nat);
    if (identityIndices.nationality < 0) identityIndices.nationality = 0;
    currentNameList = buildNameList(NATIONALITIES[identityIndices.nationality]);
    identityIndices.name = 0;
    identityIndices.occupation = Math.floor(Math.random() * OCCUPATIONS.length);

    // If player already has locked values, set indices to match
    if (player.identity.name) {
        const idx = currentNameList.indexOf(player.identity.name);
        if (idx >= 0) identityIndices.name = idx;
    }
    if (player.identity.occupation) {
        const idx = OCCUPATIONS.indexOf(player.identity.occupation);
        if (idx >= 0) identityIndices.occupation = idx;
    }
    if (player.identity.nationality) {
        identityIndices.nationality = NATIONALITIES.indexOf(player.identity.nationality);
    }

    showView('viewStage');
    updateStageUI();
    switchTab('identity');
}

function goHome() {
    showView('viewHub');
    renderPlayerList();
}

function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// ── STAGE UI ──

function getPlayer() {
    return players.find(p => p.id === currentPlayerId);
}

function updateStageUI() {
    const player = getPlayer();
    if (!player) return;

    const stage = STAGES[player.stageIndex];
    document.getElementById('stageTitle').textContent = player.realName + ' — ' + stage.name;

    // Profile summary
    const displayName = player.identity.name || player.realName;
    document.getElementById('profileAvatar').textContent = displayName.charAt(0).toUpperCase();
    document.getElementById('profileName').textContent = displayName;
    document.getElementById('profileOccupation').textContent = player.identity.occupation || '';
    document.getElementById('profileNationality').textContent = player.identity.nationality ? 'From ' + player.identity.nationality : '';
    document.getElementById('profilePlayerName').textContent = 'Player: ' + player.realName;

    // Stage progress
    const progress = document.getElementById('stageProgress');
    progress.innerHTML = STAGES.map((s, i) => {
        let cls = 'stage-dot';
        if (i === player.stageIndex) cls += ' active';
        else if (i < player.stageIndex) cls += ' completed';
        return `<div class="${cls}" onclick="jumpToStage(${i})"><span class="stage-label">${s.name}</span></div>`;
    }).join('');

    // Lock buttons
    updateLockButtons(player);

    // Identity values
    updateIdentityDisplay();

    // Advance button
    const advBtn = document.getElementById('advanceBtn');
    if (player.stageIndex >= STAGES.length - 1) {
        advBtn.textContent = 'Game Complete';
        advBtn.disabled = true;
        advBtn.style.opacity = '0.4';
    } else {
        const next = STAGES[player.stageIndex + 1];
        advBtn.textContent = 'Keep Seeing Them \u2192 ' + next.name;
        advBtn.disabled = false;
        advBtn.style.opacity = '1';
    }
}

function jumpToStage(index) {
    const player = getPlayer();
    if (!player) return;
    player.stageIndex = index;
    updateStageUI();
    renderSaved();
}

function updateLockButtons(player) {
    ['name', 'occupation', 'nationality'].forEach(field => {
        const btn = document.getElementById('lock' + field.charAt(0).toUpperCase() + field.slice(1));
        if (player.locked[field]) {
            btn.className = 'lock-btn locked';
            btn.innerHTML = SVG_LOCK + ' Locked: ' + player.identity[field];
        } else {
            btn.className = 'lock-btn unlocked';
            btn.textContent = 'Lock in';
        }
    });
}

// ── IDENTITY PICKER ──

function updateIdentityDisplay() {
    const player = getPlayer();
    if (!player) return;

    if (player.locked.name) {
        document.getElementById('idName').textContent = player.identity.name;
    } else {
        document.getElementById('idName').textContent = currentNameList[identityIndices.name] || '\u2014';
    }

    if (player.locked.occupation) {
        document.getElementById('idOccupation').textContent = player.identity.occupation;
    } else {
        document.getElementById('idOccupation').textContent = OCCUPATIONS[identityIndices.occupation] || '\u2014';
    }

    if (player.locked.nationality) {
        document.getElementById('idNationality').textContent = player.identity.nationality;
    } else {
        document.getElementById('idNationality').textContent = NATIONALITIES[identityIndices.nationality] || '\u2014';
    }
}

function prevIdentity(field) {
    const player = getPlayer();
    if (!player || player.locked[field]) return;

    if (field === 'name') {
        identityIndices.name = (identityIndices.name - 1 + currentNameList.length) % currentNameList.length;
    } else if (field === 'occupation') {
        identityIndices.occupation = (identityIndices.occupation - 1 + OCCUPATIONS.length) % OCCUPATIONS.length;
    } else if (field === 'nationality') {
        identityIndices.nationality = (identityIndices.nationality - 1 + NATIONALITIES.length) % NATIONALITIES.length;
        currentNameList = buildNameList(NATIONALITIES[identityIndices.nationality]);
        identityIndices.name = 0;
    }
    updateIdentityDisplay();
}

function nextIdentity(field) {
    const player = getPlayer();
    if (!player || player.locked[field]) return;

    if (field === 'name') {
        identityIndices.name = (identityIndices.name + 1) % currentNameList.length;
    } else if (field === 'occupation') {
        identityIndices.occupation = (identityIndices.occupation + 1) % OCCUPATIONS.length;
    } else if (field === 'nationality') {
        identityIndices.nationality = (identityIndices.nationality + 1) % NATIONALITIES.length;
        currentNameList = buildNameList(NATIONALITIES[identityIndices.nationality]);
        identityIndices.name = 0;
    }
    updateIdentityDisplay();
}

function shuffleIdentity(field) {
    const player = getPlayer();
    if (!player || player.locked[field]) return;

    if (field === 'name') {
        identityIndices.name = Math.floor(Math.random() * currentNameList.length);
    } else if (field === 'occupation') {
        identityIndices.occupation = Math.floor(Math.random() * OCCUPATIONS.length);
    } else if (field === 'nationality') {
        identityIndices.nationality = Math.floor(Math.random() * NATIONALITIES.length);
        currentNameList = buildNameList(NATIONALITIES[identityIndices.nationality]);
        identityIndices.name = Math.floor(Math.random() * currentNameList.length);
    }
    updateIdentityDisplay();
}

function toggleLock(field) {
    const player = getPlayer();
    if (!player) return;

    if (player.locked[field]) {
        // Unlock
        player.locked[field] = false;
        player.identity[field] = null;
    } else {
        // Lock
        let value;
        if (field === 'name') value = currentNameList[identityIndices.name];
        else if (field === 'occupation') value = OCCUPATIONS[identityIndices.occupation];
        else if (field === 'nationality') value = NATIONALITIES[identityIndices.nationality];

        player.identity[field] = value;
        player.locked[field] = true;
    }

    // Auto-save identity if all three are locked and on first stage
    if (player.locked.name && player.locked.occupation && player.locked.nationality) {
        showToast('Identity locked in');
    }

    updateLockButtons(player);
    updateStageUI();
}

// ── TABS ──

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');

    document.getElementById('tabIdentity').style.display = tab === 'identity' ? 'block' : 'none';
    document.getElementById('tabFlags').style.display = tab === 'flags' ? 'block' : 'none';
    document.getElementById('tabSaved').style.display = tab === 'saved' ? 'block' : 'none';

    if (tab === 'saved') renderSaved();
    if (tab === 'flags') nextFlag();
}

// ── FLAG SWIPER ──

function setFlagMode(mode) {
    flagMode = mode;
    document.getElementById('modeRed').className = mode === 'red' ? 'mode-btn active-red' : 'mode-btn';
    document.getElementById('modeGreen').className = mode === 'green' ? 'mode-btn active-green' : 'mode-btn';

    const card = document.getElementById('swiperCard');
    const saveBtn = document.getElementById('saveBtn');
    if (mode === 'green') {
        card.classList.add('green');
        saveBtn.classList.add('green-save');
    } else {
        card.classList.remove('green');
        saveBtn.classList.remove('green-save');
    }
    nextFlag();
}

function nextFlag() {
    const key = flagMode;
    const list = key === 'red' ? shuffledRed : shuffledGreen;
    currentFlagIndex[key]++;

    if (currentFlagIndex[key] >= list.length) {
        if (key === 'red') shuffledRed = shuffle(RED_FLAGS);
        else shuffledGreen = shuffle(GREEN_FLAGS);
        currentFlagIndex[key] = 0;
    }

    const flag = (key === 'red' ? shuffledRed : shuffledGreen)[currentFlagIndex[key]];
    document.getElementById('swiperIcon').innerHTML = key === 'red' ? SVG_FLAG_RED_BIG : SVG_FLAG_GREEN_BIG;
    document.getElementById('swiperText').textContent = flag;

    // Animate
    const card = document.getElementById('swiperCard');
    card.style.transform = 'scale(0.97)';
    setTimeout(() => card.style.transform = 'scale(1)', 100);
}

function saveFlag() {
    const player = getPlayer();
    if (!player) return;

    const key = flagMode;
    const list = key === 'red' ? shuffledRed : shuffledGreen;
    const flag = list[currentFlagIndex[key]];
    if (!flag) return;

    const stage = STAGES[player.stageIndex];

    // Check if this stage is already locked
    if (player.lockedFlags[stage.id]) {
        showToast('This stage is locked. Advance to save more flags.');
        return;
    }

    const entry = { text: flag, type: key };

    // Don't duplicate
    if (!player.flags[stage.id].some(f => f.text === flag)) {
        player.flags[stage.id].push(entry);
        showToast('Saved');
    }
}

// ── SAVED FLAGS ──

function renderSaved() {
    const player = getPlayer();
    if (!player) return;

    const section = document.getElementById('savedSection');
    let html = '';
    let totalFlags = 0;

    STAGES.forEach((stage, stageIdx) => {
        const flags = player.flags[stage.id];
        const isLocked = !!player.lockedFlags[stage.id];
        if (flags.length === 0 && stageIdx > player.stageIndex) return;

        html += `<div class="saved-stage-group">
            <div class="saved-stage-title">${stage.name} (${flags.length})${isLocked ? ' <span class="locked-badge">' + SVG_LOCK + ' locked</span>' : ''}</div>`;

        if (flags.length === 0) {
            html += `<div class="no-flags" style="padding:12px">No flags yet</div>`;
        } else {
            flags.forEach((f, i) => {
                const icon = f.type === 'red' ? SVG_FLAG_RED : SVG_FLAG_GREEN;
                html += `<div class="saved-flag">
                    <span class="saved-flag-icon">${icon}</span>
                    <span class="saved-flag-text">${f.text}</span>
                    ${!isLocked ? `<button class="saved-flag-remove" onclick="removeFlag('${stage.id}', ${i})">&times;</button>` : ''}
                </div>`;
            });
        }
        html += `</div>`;
        totalFlags += flags.length;
    });

    if (totalFlags === 0) {
        html = '<div class="no-flags">No flags saved yet. Go swipe some.</div>';
    }

    section.innerHTML = html;
}

function removeFlag(stageId, index) {
    const player = getPlayer();
    if (!player) return;
    // Can't remove from locked stages
    if (player.lockedFlags[stageId]) return;
    player.flags[stageId].splice(index, 1);
    renderSaved();
}

// ── ADVANCE STAGE (Keep Seeing Them) ──

function advanceStage() {
    const player = getPlayer();
    if (!player || player.stageIndex >= STAGES.length - 1) return;

    const currentStage = STAGES[player.stageIndex];

    // Lock the current stage's flags - snapshot them
    player.lockedFlags[currentStage.id] = [...player.flags[currentStage.id]];

    // Also auto-lock identity if not already locked
    if (!player.locked.name && currentNameList[identityIndices.name]) {
        player.identity.name = currentNameList[identityIndices.name];
        player.locked.name = true;
    }
    if (!player.locked.occupation) {
        player.identity.occupation = OCCUPATIONS[identityIndices.occupation];
        player.locked.occupation = true;
    }
    if (!player.locked.nationality) {
        player.identity.nationality = NATIONALITIES[identityIndices.nationality];
        player.locked.nationality = true;
    }

    player.stageIndex++;
    reshuffleFlags();
    updateStageUI();
    renderSaved();
    switchTab('flags');
    showToast('Advanced to ' + STAGES[player.stageIndex].name);
}

// ── DISCARD & START OVER ──

function discardAndRestart() {
    const player = getPlayer();
    if (!player) return;

    // Reset everything for this player
    player.stageIndex = 0;
    player.identity = { name: null, occupation: null, nationality: null };
    player.locked = { name: false, occupation: false, nationality: false };
    STAGES.forEach(s => { player.flags[s.id] = []; player.lockedFlags[s.id] = null; });

    reshuffleFlags();
    identityIndices = { name: 0, occupation: 0, nationality: 0 };
    currentNameList = buildNameList(NATIONALITIES[0]);

    updateStageUI();
    renderSaved();
    switchTab('identity');
    showToast('Starting fresh');
}

// ── INIT ──

document.getElementById('playerNameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addPlayer();
});

renderPlayerList();
</script>
